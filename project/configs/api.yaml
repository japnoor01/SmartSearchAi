# =============================================================================
# SmartSearch AI -- FastAPI backend configuration
# =============================================================================
# Consumed by:
#   src/api/config.py
#   src/api/app.py
#
# Production defaults resolve paths relative to the project root.
# Environment variables override any setting here (e.g. SMARTSEARCH_MODEL_PATH).

environment: "development"  # Options: development, production, testing

server:
  host: "127.0.0.1"
  port: 8000
  reload: false
  request_timeout_seconds: 5.0

model:
  checkpoint_path: "models/lstm/best_model.pt"
  tokenizer_dir: "models/lstm/tokenizer"
  device: "auto"

retrieval:
  index_path: "data/indexes/prefix_real/prefix_index.sqlite3"
  candidate_pool_size: 50

limits:
  default_top_k: 5
  max_top_k: 50
  min_top_k: 1
  max_query_length: 200

rate_limit:
  enabled: true
  max_requests: 120
  window_seconds: 60.0

cors:
  # Development origins (permits local extension development and test pages)
  development_origins:
    - "http://localhost"
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://localhost:8000"
    - "http://127.0.0.1"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:5173"
    - "http://127.0.0.1:8000"
  development_origin_regex: "^(chrome-extension://[a-zA-Z0-9]+|http://(localhost|127\\.0\\.0\\.1)(:\\d+)?|null)$"

  # Production origins (strict explicit allowlist, no extension or null wildcards)
  production_origins: []
  production_origin_regex: null

logging:
  level: "INFO"
  log_queries: false  # Privacy: Avoid logging sensitive raw user queries

trust:
  enabled: true
  cache_ttl_seconds: 300.0
  cache_max_items: 1000
  partners_path: "configs/verified_partners.yaml"
  safe_browsing_api_key: ""
  virustotal_api_key: ""

