# =============================================================================
# SmartSearch AI -- Nginx Reverse Proxy Configuration
# =============================================================================

upstream smartsearch_backend {
    server smartsearch-api:8000;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# HTTP Server (Local development & reverse proxy routing)
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name localhost;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Request size limit (protects backend against oversized payloads)
    client_max_body_size 1m;

    # Gzip compression for JSON API autocomplete responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 256;

    # Proxy timeout limits (ensures slow clients or stalled connections do not tie up resources)
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    # Autocomplete and public API routes
    location / {
        proxy_pass http://smartsearch_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass latency headers back to client
        proxy_pass_header X-Process-Time-Ms;
    }

    # Health & readiness probes (lightweight, minimal access logging)
    location ~ ^/(health|readiness)$ {
        proxy_pass http://smartsearch_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }
}

